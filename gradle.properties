# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM heap — helps with large Compose projects
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Disable Jetifier (not needed — all deps are AndroidX-native)
android.enableJetifier=false

# Suppress the compileSdk compatibility warning now that AGP 8.7.3 fully supports SDK 35
# (Kept here as documentation; 8.7.3 does not require it — but harmless to have)
# android.suppressUnsupportedCompileSdk=35

# Non-transitive R classes — reduces build time and avoids resource conflicts
android.nonTransitiveRClass=true
